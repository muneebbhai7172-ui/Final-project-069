<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Theme Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
            margin: 0;
        }
        .test-panel {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .theme-button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .default { background: #667eea; }
        .ocean { background: #3b82f6; }
        .forest { background: #10b981; }
        .purple { background: #8b5cf6; }
        .dark { background: #1f2937; }
        
        #status {
            margin-top: 20px;
            padding: 10px;
            background: #e0f2fe;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="test-panel">
        <h2>Sidebar Theme Test</h2>
        <p>Click these buttons to test if sidebar background changes with themes:</p>
        
        <button class="theme-button default" onclick="testTheme('default')">Default</button>
        <button class="theme-button ocean" onclick="testTheme('ocean-blue')">Ocean Blue</button>
        <button class="theme-button forest" onclick="testTheme('forest-green')">Forest Green</button>
        <button class="theme-button purple" onclick="testTheme('royal-purple')">Royal Purple</button>
        <button class="theme-button dark" onclick="testTheme('midnight-dark')">Midnight Dark</button>
        
        <div id="status"></div>
        
        <p><strong>Test Pages:</strong></p>
        <button onclick="window.open('modules/dashboard/index.html', '_blank')">Dashboard</button>
        <button onclick="window.open('modules/medicines/index.html', '_blank')">Medicines</button>
        <button onclick="window.open('modules/settings/index.html', '_blank')">Settings</button>
    </div>
    
    <script>
        function testTheme(themeName) {
            localStorage.setItem('adminTheme', themeName);
            document.getElementById('status').innerHTML = 
                `<strong>Theme set to: ${themeName}</strong><br>` +
                `Now open any admin page to see if sidebar background changes.<br>` +
                `Stored in localStorage: ${localStorage.getItem('adminTheme')}`;
        }
        
        // Show current theme
        window.onload = function() {
            const currentTheme = localStorage.getItem('adminTheme') || 'default';
            document.getElementById('status').innerHTML = 
                `<strong>Current theme: ${currentTheme}</strong><br>` +
                `Click buttons above to change theme, then test admin pages.`;
        }
    </script>
</body>
</html>
