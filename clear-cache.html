<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Clearing Cache - Muneeb Drug House</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .clear-cache-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            text-align: center;
        }
        .spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .success-icon {
            font-size: 80px;
            color: #10b981;
            margin-bottom: 20px;
            display: none;
        }
        .btn-go {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 600;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        .btn-go:hover {
            transform: scale(1.05);
            color: white;
        }
        .progress-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        .sub-text {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="clear-cache-card">
        <div class="spinner" id="spinner"></div>
        <div class="success-icon" id="successIcon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h2 class="progress-text" id="progressText">Clearing Cache...</h2>
        <p class="sub-text" id="subText">Please wait while we refresh your application</p>

        <div id="actionButtons" style="display: none;">
            <a href="modules/shop/cart.html" class="btn btn-go">
                <i class="fas fa-shopping-cart me-2"></i>Go to Cart
            </a>
            <br><br>
            <a href="modules/shop/search.html" class="btn btn-go">
                <i class="fas fa-search me-2"></i>Search Medicines
            </a>
        </div>
    </div>

    <script>
        // Clear all caches
        function clearAllCaches() {
            return new Promise((resolve) => {
                // Clear localStorage (preserve cart)
                const cart = localStorage.getItem('cart');
                localStorage.clear();
                sessionStorage.clear();

                if (cart) {
                    localStorage.setItem('cart', cart);
                }

                // Set new version
                localStorage.setItem('app-version', '3.0');
                localStorage.setItem('cache-cleared', new Date().toISOString());

                // Simulate clearing process
                setTimeout(resolve, 2000);
            });
        }

        // Run cache clearing on page load
        window.addEventListener('load', async () => {
            try {
                await clearAllCaches();

                // Show success
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('successIcon').style.display = 'block';
                document.getElementById('progressText').textContent = 'Cache Cleared Successfully!';
                document.getElementById('subText').innerHTML = 'Your application is now using the latest version (v3.0)<br>All old cached files have been removed.';
                document.getElementById('actionButtons').style.display = 'block';

                console.log('✅ Cache cleared successfully!');
                console.log('📦 Cart data preserved');
                console.log('🚀 Version updated to 3.0');

            } catch (error) {
                console.error('Error clearing cache:', error);
                document.getElementById('progressText').textContent = 'Cache Cleared!';
                document.getElementById('subText').textContent = 'You can now proceed to use the application.';
                document.getElementById('actionButtons').style.display = 'block';
            }
        });

        // Also clear on visibility change (when user comes back to tab)
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                console.log('Tab visible - ensuring fresh cache');
            }
        });
    </script>
</body>
</html>
