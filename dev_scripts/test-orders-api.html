<!DOCTYPE html>
<html>
<head>
    <title>Orders Test</title>
</head>
<body>
    <h1>Orders Test</h1>
    <button onclick="testLoadOrders()">Test Load Orders</button>
    <div id="result"></div>

    <script>
        function testLoadOrders() {
            console.log('Testing loadOrders API...');
            fetch('http://localhost:8000/api/orders')
                .then(response => {
                    console.log('Response status:', response.status);
                    return response.json();
                })
                .then(data => {
                    console.log('API Response:', data);
                    document.getElementById('result').innerHTML = `
                        <h2>API Test Results:</h2>
                        <p>Success: ${data.success}</p>
                        <p>Orders Count: ${data.data ? data.data.length : 0}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('result').innerHTML = `
                        <h2>Error:</h2>
                        <p>${error.message}</p>
                    `;
                });
        }

        // Test if server is running
        window.onload = function() {
            fetch('http://localhost:8000/api/orders')
                .then(response => {
                    if (response.ok) {
                        document.getElementById('result').innerHTML = '<p style="color: green;">✓ Laravel server is running and API is accessible</p>';
                    } else {
                        document.getElementById('result').innerHTML = '<p style="color: red;">✗ Laravel server responded with error: ' + response.status + '</p>';
                    }
                })
                .catch(error => {
                    document.getElementById('result').innerHTML = '<p style="color: red;">✗ Laravel server is not running or not accessible</p>';
                });
        };
    </script>
</body>
</html>
