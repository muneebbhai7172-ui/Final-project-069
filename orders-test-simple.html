<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Test - Direct Laravel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h2>Orders Management Test</h2>

        <div class="mb-3">
            <button class="btn btn-primary" onclick="loadOrders()">
                <i class="fas fa-sync-alt"></i> Load Orders
            </button>
            <button class="btn btn-outline-primary" onclick="switchView('table')">
                <i class="fas fa-table"></i> Table View
            </button>
            <button class="btn btn-outline-primary" onclick="switchView('card')">
                <i class="fas fa-th-large"></i> Card View
            </button>
        </div>

        <div id="status" class="alert alert-info">Ready to test...</div>

        <div id="tableView">
            <table class="table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr>
                        <td colspan="5" class="text-center">Click "Load Orders" to fetch data</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="cardView" style="display: none;">
            <div class="row" id="orders-cards">
                <div class="col-12 text-center">
                    <p>Card view ready</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        console.log('Simple orders test script loaded');

        let allOrders = [];
        let currentView = 'table';

        // Simple API client
        class SimpleAPI {
            constructor() {
                this.baseURL = 'http://localhost:8000';
            }

            async getOrders() {
                const response = await fetch(`${this.baseURL}/api/orders`);
                const data = await response.json();
                if (data.success) {
                    return data.data;
                } else {
                    throw new Error(data.message || 'Failed to fetch orders');
                }
            }
        }

        const api = new SimpleAPI();

        // Load orders function
        async function loadOrders() {
            console.log('loadOrders called');
            const status = document.getElementById('status');
            const tbody = document.getElementById('orders-table-body');

            status.textContent = 'Loading orders...';
            status.className = 'alert alert-info';

            try {
                const orders = await api.getOrders();
                allOrders = orders;

                console.log('Orders loaded:', orders.length);
                status.textContent = `Successfully loaded ${orders.length} orders`;
                status.className = 'alert alert-success';

                // Display in table
                tbody.innerHTML = '';
                orders.forEach(order => {
                    const row = `
                        <tr>
                            <td>${order.order_id || order.id}</td>
                            <td>${order.customer_name || 'N/A'}</td>
                            <td>Rs. ${parseFloat(order.total_amount || 0).toFixed(2)}</td>
                            <td>
                                <span class="badge bg-${getStatusColor(order.status)}">${order.status}</span>
                            </td>
                            <td>${new Date(order.created_at || order.order_date).toLocaleDateString()}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error('Error loading orders:', error);
                status.textContent = `Error: ${error.message}`;
                status.className = 'alert alert-danger';

                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center text-danger">
                            <i class="fas fa-exclamation-triangle"></i>
                            Error loading orders: ${error.message}
                        </td>
                    </tr>
                `;
            }
        }

        // Switch view function
        function switchView(view) {
            console.log('switchView called with:', view);
            const status = document.getElementById('status');
            const tableView = document.getElementById('tableView');
            const cardView = document.getElementById('cardView');

            currentView = view;

            if (view === 'table') {
                tableView.style.display = 'block';
                cardView.style.display = 'none';
                status.textContent = 'Switched to table view';
            } else {
                tableView.style.display = 'none';
                cardView.style.display = 'block';
                status.textContent = 'Switched to card view';

                // Simple card display
                const cardsContainer = document.getElementById('orders-cards');
                cardsContainer.innerHTML = '';

                if (allOrders.length > 0) {
                    allOrders.forEach(order => {
                        const card = `
                            <div class="col-md-4 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">${order.order_id || order.id}</h5>
                                        <p class="card-text">
                                            <strong>${order.customer_name || 'N/A'}</strong><br>
                                            Rs. ${parseFloat(order.total_amount || 0).toFixed(2)}<br>
                                            <span class="badge bg-${getStatusColor(order.status)}">${order.status}</span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        `;
                        cardsContainer.innerHTML += card;
                    });
                } else {
                    cardsContainer.innerHTML = '<div class="col-12 text-center"><p>No orders to display</p></div>';
                }
            }

            status.className = 'alert alert-info';
        }

        // Helper function
        function getStatusColor(status) {
            switch(status) {
                case 'Pending': return 'warning';
                case 'Dispatched': return 'info';
                case 'Completed': return 'success';
                case 'Cancelled': return 'danger';
                default: return 'secondary';
            }
        }

        // Make functions globally available
        window.loadOrders = loadOrders;
        window.switchView = switchView;
        window.api = api;

        // Test on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded');
            console.log('Functions available:');
            console.log('- loadOrders:', typeof window.loadOrders);
            console.log('- switchView:', typeof window.switchView);
            console.log('- api:', typeof window.api);

            // Auto-load orders
            setTimeout(loadOrders, 500);
        });
    </script>
</body>
</html>
