<script>
// API Base URL helper
function getBaseURL() {
    const loc = window.location;
    if (loc.port === '8000') return loc.origin;
    if (loc.pathname.includes('/waqar/')) return loc.origin + '/waqar/public';
    return loc.origin;
}

const API_BASE = getBaseURL();

// Load user profile on page load
document.addEventListener('DOMContentLoaded', function() {
    loadUserProfile();
});

// Fetch and display current user's profile
function loadUserProfile() {
    fetch(API_BASE + '/api/auth/user', {
        method: 'GET',
        credentials: 'include',
        headers: { 'Accept': 'application/json' }
    })
    .then(response => response.json())
    .then(data => {
        console.log('User profile loaded:', data);
        if (data.success && data.user) {
            document.getElementById('fullName').value = data.user.full_name || '';
            document.getElementById('username').value = data.user.username || '';
            document.getElementById('email').value = data.user.email || '';
            // Update role display
            const roleInput = document.querySelector('#profileForm input[readonly][value="Administrator"]');
            if (roleInput && data.user.role) {
                roleInput.value = data.user.role.charAt(0).toUpperCase() + data.user.role.slice(1);
            }
        } else if (data.username) {
            // Direct user object returned
            document.getElementById('fullName').value = data.full_name || '';
            document.getElementById('username').value = data.username || '';
            document.getElementById('email').value = data.email || '';
            const roleInput = document.querySelector('#profileForm input[readonly][value="Administrator"]');
            if (roleInput && data.role) {
                roleInput.value = data.role.charAt(0).toUpperCase() + data.role.slice(1);
            }
        }
    })
    .catch(error => {
        console.error('Failed to load profile:', error);
    });
}

// Update profile
function updateProfile() {
    const data = {
        full_name: document.getElementById('fullName').value,
        email: document.getElementById('email').value
    };

    fetch(API_BASE + '/api/settings/profile', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            showSuccess('Profile updated successfully!');
        } else {
            showError(result.message || 'Failed to update profile');
        }
    })
    .catch(error => {
        console.error('Profile update error:', error);
        showError('Failed to update profile');
    });
}

// Change password
function changePassword() {
    const current = document.getElementById('currentPassword').value;
    const newPass = document.getElementById('newPassword').value;
    const confirm = document.getElementById('confirmPassword').value;

    if (newPass !== confirm) {
        showError('New passwords do not match!');
        return;
    }

    fetch(API_BASE + '/api/settings/password', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify({
            current_password: current,
            new_password: newPass
        })
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            document.getElementById('passwordForm').reset();
            showSuccess('Password changed successfully!');
        } else {
            showError(result.message || 'Failed to change password');
        }
    })
    .catch(error => {
        console.error('Password change error:', error);
        showError('Failed to change password');
    });
}

// Update store info
function updateStoreInfo() {
    const data = {
        store_name: document.getElementById('storeName').value,
        store_address: document.getElementById('storeAddress').value,
        store_phone: document.getElementById('storePhone').value
    };

    fetch(API_BASE + '/api/settings/store', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            showSuccess('Store information updated!');
        } else {
            showError(result.message || 'Failed to update store info');
        }
    })
    .catch(error => {
        console.error('Store update error:', error);
        showError('Failed to update store info');
    });
}

// Update system settings
function updateSystemSettings() {
    const data = {
        low_stock_threshold: document.getElementById('lowStockThreshold').value,
        currency: document.getElementById('currency').value,
        email_notifications: document.getElementById('emailNotifications').checked
    };

    fetch(API_BASE + '/api/settings/system', {
        method: 'POST',
        credentials: 'include',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => response.json())
    .then(result => {
        if (result.success) {
            showSuccess('System settings updated!');
        } else {
            showError(result.message || 'Failed to update settings');
        }
    })
    .catch(error => {
        console.error('System settings error:', error);
        showError('Failed to update settings');
    });
}

function showSuccess(message) {
    showToast(message, 'success');
}

function showError(message) {
    showToast(message, 'error');
}

// Toast Notifications
function showToast(message, type = 'info') {
    const toastContainer = document.querySelector('.toast-container') || createToastContainer();
    const toastId = 'toast-' + Date.now();

    const icons = {
        success: 'fa-check-circle',
        error: 'fa-times-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
    };

    const colors = {
        success: '#10b981',
        error: '#ef4444',
        warning: '#f59e0b',
        info: '#3b82f6'
    };

    const toastHTML = `
        <div id="${toastId}" class="toast custom-toast align-items-center border-0" role="alert" style="border-left: 5px solid ${colors[type]};">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center">
                    <i class="fas ${icons[type]} fa-lg me-3" style="color: ${colors[type]}"></i>
                    <span>${message}</span>
                </div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    `;

    toastContainer.insertAdjacentHTML('beforeend', toastHTML);

    const toastElement = document.getElementById(toastId);
    const toast = new bootstrap.Toast(toastElement, { delay: 4000 });
    toast.show();

    toastElement.addEventListener('hidden.bs.toast', function() {
        this.remove();
    });
}

function createToastContainer() {
    const container = document.createElement('div');
    container.className = 'toast-container position-fixed top-0 end-0 p-3';
    container.style.zIndex = '9999';
    document.body.appendChild(container);
    return container;
}

// Confirmation Modal
function showConfirmModal(message, onConfirm) {
    // Create modal if it doesn't exist
    let modal = document.getElementById('confirmModal');
    if (!modal) {
        const modalHTML = `
            <div class="modal fade" id="confirmModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title">
                                <i class="fas fa-exclamation-triangle me-2"></i>Confirm Action
                            </h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <p id="confirmMessage"></p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fas fa-times me-2"></i>Cancel
                            </button>
                            <button type="button" class="btn btn-danger" id="confirmActionBtn">
                                <i class="fas fa-check me-2"></i>Confirm
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHTML);
        modal = document.getElementById('confirmModal');
    }

    document.getElementById('confirmMessage').textContent = message;

    const modalInstance = new bootstrap.Modal(modal);
    modalInstance.show();

    document.getElementById('confirmActionBtn').onclick = function() {
        onConfirm();
        modalInstance.hide();
    };
}
</script>
