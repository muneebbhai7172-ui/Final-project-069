<!DOCTYPE html>
<html>
<head>
    <title>Test Orders API</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; overflow: auto; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Orders API Test</h1>
    <button onclick="testAPI()">Test API Connection</button>
    <button onclick="loadOrdersSimple()">Load Orders</button>
    <hr>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';

            try {
                const response = await fetch('http://127.0.0.1:8000/api/orders', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <p class="success">✓ API is working!</p>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Orders found:</strong> ${data.data ? data.data.length : 'unknown'}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <p class="error">✗ API returned error</p>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Text:</strong> ${await response.text()}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p class="error">✗ Error connecting to API:</p>
                    <p>${error.message}</p>
                `;
            }
        }

        async function loadOrdersSimple() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Loading orders...</p>';

            try {
                // Try different endpoints
                const endpoints = [
                    'http://127.0.0.1:8000/api/orders',
                    'http://localhost:8000/api/orders',
                    window.location.origin + '/api/orders',
                    window.location.origin + '/waqar/public/api/orders'
                ];

                for (const endpoint of endpoints) {
                    try {
                        console.log('Trying:', endpoint);
                        const response = await fetch(endpoint, { credentials: 'include' });
                        if (response.ok) {
                            const data = await response.json();
                            resultDiv.innerHTML = `
                                <p class="success">✓ Connected to: ${endpoint}</p>
                                <p><strong>Orders:</strong> ${data.data.length}</p>
                                <pre>${JSON.stringify(data.data, null, 2)}</pre>
                            `;
                            return;
                        }
                    } catch (e) {
                        console.log('Failed:', endpoint, e.message);
                    }
                }
                
                resultDiv.innerHTML = '<p class="error">✗ Could not connect to any endpoint</p>';
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
