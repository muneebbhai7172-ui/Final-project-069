<body>
    <!-- Include required JavaScript files -->
    <script src="js/utils.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/crud-helpers.js"></script>

    <div class="test-container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0">
                    <i class="fas fa-plug me-2"></i>
                    Laravel Backend API Connection Test
                </h3>
            </div>
            <div class="card-body">
                <div class="summary" id="summary">
                    <div class="summary-card total">
                        <div class="summary-number" id="total-tests">0</div>
                        <div class="summary-label">Total Tests</div>
                    </div>
                    <div class="summary-card success">
                        <div class="summary-number" id="success-tests">0</div>
                        <div class="summary-label">Successful</div>
                    </div>
                    <div class="summary-card failed">
                        <div class="summary-number" id="failed-tests">0</div>
                        <div class="summary-label">Failed</div>
                    </div>
                </div>

                <div class="text-center mb-4">
                    <button class="btn btn-test-all btn-lg" onclick="runAllTests()">
                        <i class="fas fa-play me-2"></i>Run All Tests
                    </button>
                </div>

                <div id="test-results"></div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api-client.js"></script>
    <script src="/js/crud-helpers.js"></script>

    <script>
        const tests = [
            // Authentication Tests
            { name: 'Check Auth Status', fn: () => api.checkAuth(), category: 'Authentication' },

            // Medicine Tests
            { name: 'Get All Medicines', fn: () => api.getMedicines(), category: 'Medicines' },
            { name: 'Search Medicines', fn: () => api.searchMedicines('test'), category: 'Medicines' },
            { name: 'Get Low Stock Medicines', fn: () => api.getLowStock(), category: 'Medicines' },
            { name: 'Get Expiring Medicines', fn: () => api.getExpiringSoon(30), category: 'Medicines' },

            // Customer Tests
            { name: 'Get All Customers', fn: () => api.getCustomers(), category: 'Customers' },
            { name: 'Search Customers', fn: () => api.searchCustomers('test'), category: 'Customers' },

            // Order Tests
            { name: 'Get All Orders', fn: () => api.getOrders(), category: 'Orders' },
            { name: 'Get Pending Orders', fn: () => api.getPendingOrders(), category: 'Orders' },

            // Billing Tests
            { name: 'Get All Bills', fn: () => api.getBills(), category: 'Billing' },
            { name: 'Get Today Bills', fn: () => api.getTodayBills(), category: 'Billing' },

            // Dashboard Tests
            { name: 'Get Dashboard Stats', fn: () => api.getDashboardStats(), category: 'Dashboard' },
            { name: 'Get Sales Summary', fn: () => api.getSalesSummary('today'), category: 'Dashboard' },
            { name: 'Get Revenue Chart', fn: () => api.getRevenueChart(7), category: 'Dashboard' },

            // Report Tests
            { name: 'Get Sales Report', fn: () => api.getSalesReport('2024-01-01', '2024-12-31'), category: 'Reports' },
            { name: 'Get Stock Report', fn: () => api.getStockReport(), category: 'Reports' },
            { name: 'Get Customer Report', fn: () => api.getCustomerReport('2024-01-01', '2024-12-31'), category: 'Reports' },

            // Stock Tests
            { name: 'Get Stock Status', fn: () => api.getStockStatus(), category: 'Stock' },

            // Settings Tests
            { name: 'Get All Settings', fn: () => api.getSettings(), category: 'Settings' },

            // Backup Tests
            { name: 'Get Backup List', fn: () => api.getBackups(), category: 'Backup' }
        ];

        let successCount = 0;
        let failedCount = 0;

        function updateSummary() {
            document.getElementById('total-tests').textContent = tests.length;
            document.getElementById('success-tests').textContent = successCount;
            document.getElementById('failed-tests').textContent = failedCount;
        }

        async function runAllTests() {
            const resultsContainer = document.getElementById('test-results');
            resultsContainer.innerHTML = '';
            successCount = 0;
            failedCount = 0;
            updateSummary();

            let currentCategory = '';

            for (const test of tests) {
                // Add category header if new category
                if (test.category !== currentCategory) {
                    currentCategory = test.category;
                    const categoryHeader = document.createElement('div');
                    categoryHeader.className = 'test-category mt-4 mb-2';
                    categoryHeader.innerHTML = `<h5 class="text-primary"><i class="fas fa-folder me-2"></i>${currentCategory}</h5>`;
                    resultsContainer.appendChild(categoryHeader);
                }

                const testItem = document.createElement('div');
                testItem.className = 'test-item';
                testItem.innerHTML = `
                    <div>
                        <div class="test-name">${test.name}</div>
                        <div class="test-details" id="details-${tests.indexOf(test)}"></div>
                    </div>
                    <div class="status pending" id="status-${tests.indexOf(test)}">
                        <div class="spinner"></div>
                        <span>Testing...</span>
                    </div>
                `;
                resultsContainer.appendChild(testItem);

                try {
                    const startTime = Date.now();
                    const response = await test.fn();
                    const duration = Date.now() - startTime;

                    const statusEl = document.getElementById(`status-${tests.indexOf(test)}`);
                    const detailsEl = document.getElementById(`details-${tests.indexOf(test)}`);

                    if (response && (response.success !== false || response.data)) {
                        statusEl.className = 'status success';
                        statusEl.innerHTML = `
                            <i class="fas fa-check-circle"></i>
                            <span>Success (${duration}ms)</span>
                        `;

                        // Show response details
                        if (response.data) {
                            const count = Array.isArray(response.data) ? response.data.length : 'object';
                            detailsEl.textContent = `Response: ${count} items returned`;
                        } else if (response.success) {
                            detailsEl.textContent = `Response: Success`;
                        }

                        successCount++;
                    } else {
                        throw new Error(response.message || 'Unknown error');
                    }
                } catch (error) {
                    const statusEl = document.getElementById(`status-${tests.indexOf(test)}`);
                    const detailsEl = document.getElementById(`details-${tests.indexOf(test)}`);

                    statusEl.className = 'status error';
                    statusEl.innerHTML = `
                        <i class="fas fa-times-circle"></i>
                        <span>Failed</span>
                    `;
                    detailsEl.textContent = `Error: ${error.message}`;
                    detailsEl.style.color = '#dc3545';
                    failedCount++;
                }

                updateSummary();
            }

            // Show completion message
            if (failedCount === 0) {
                showSuccess(`All ${tests.length} tests passed! ✅`);
            } else {
                showError(`${failedCount} out of ${tests.length} tests failed ❌`);
            }
        }

        // Initialize summary
        updateSummary();
    </script>
</body>
