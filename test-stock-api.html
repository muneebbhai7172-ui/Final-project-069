<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Stock API Test</h1>
    <button onclick="testAPI()">Test API</button>
    <button onclick="testStockJS()">Test Stock.js</button>

    <div id="results"></div>

    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'test-result ' + type;
            div.innerHTML = message;
            document.getElementById('results').appendChild(div);
        }

        async function testAPI() {
            document.getElementById('results').innerHTML = '';
            log('Testing API endpoint...', 'info');

            try {
                const url = 'http://localhost/waqar/public/api/medicines/stock';
                log('URL: ' + url, 'info');

                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });

                log('Response Status: ' + response.status, response.ok ? 'success' : 'error');

                const data = await response.json();
                log('Response received with ' + (data.data ? data.data.length : 0) + ' items', 'success');
                log('<pre>' + JSON.stringify(data, null, 2).substring(0, 500) + '...</pre>', 'info');

            } catch (error) {
                log('Error: ' + error.message, 'error');
                console.error(error);
            }
        }

        async function testStockJS() {
            document.getElementById('results').innerHTML = '';
            log('Testing Stock.js...', 'info');

            if (typeof Stock === 'undefined') {
                log('Stock object is not defined!', 'error');
                return;
            }

            log('Stock object found', 'success');
            log('Stock methods: ' + Object.keys(Stock).join(', '), 'info');

            try {
                Stock.init();
                log('Stock.init() called successfully', 'success');
            } catch (error) {
                log('Error calling Stock.init(): ' + error.message, 'error');
                console.error(error);
            }
        }
    </script>

    <script src="public/js/utils.js"></script>
    <script src="public/js/stock.js"></script>
</body>
</html>
